name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm audit --omit=dev --audit-level=critical

      - run: npm run prisma:generate

      - run: npx prisma db push --schema prisma/schema.sqlite.prisma
        env:
          DATABASE_URL: "file:./test.db"

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:coverage

      - run: npm run build

  e2e:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run prisma:generate

      - run: npx prisma db push --schema prisma/schema.sqlite.prisma
        env:
          DATABASE_URL: "file:./test.db"

      - run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV

      - run: npx playwright install chromium

      - run: npm run test:e2e
        env:
          DATABASE_URL: "file:./test.db"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_0tbbu6XeDEvkxx5tZkaj9wXH
      VERCEL_PROJECT_ID: prj_NjAFxN02Ru4YfvA8NrKmGMjpfSaq

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Vercel production
        run: npx --yes vercel@latest deploy --prod --token="${{ secrets.VERCEL_TOKEN }}"
